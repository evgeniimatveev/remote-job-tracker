name: Live API run (manual)

# Manual only: click "Run workflow" in the Actions tab. No push / PR / schedule triggers.
# Runs the real pipeline against the live Arbeitnow API (the result is not committed).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run the pipeline against the live API
        run: python main.py
      - name: The run produced a real snapshot (see Job Summary)
        run: python .github/scripts/check_live.py
